name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environnement cible
        type: choice
        options: [production]
        default: production

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build-and-push:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tags.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT_SHA }}
      - name: Calculer les tags
        id: tags
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "name=$name"
            echo "short-sha=${COMMIT_SHA::7}"
            echo "version=$(cat VERSION)"
            echo "image=$name:${COMMIT_SHA::7}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build et push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.tags.outputs.version }}
            APP_COMMIT=${{ steps.tags.outputs.short-sha }}
          tags: |
            ${{ steps.tags.outputs.name }}:latest
            ${{ steps.tags.outputs.name }}:${{ steps.tags.outputs.short-sha }}
            ${{ steps.tags.outputs.name }}:${{ steps.tags.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.COMMIT_SHA }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    environment: ${{ inputs.environment || 'production' }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT_SHA }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deployer, verifier, rollback si besoin
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: ./deploy/deploy.sh "$IMAGE"
